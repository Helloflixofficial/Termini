name: Android Production Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    name: Build signed production artifacts
    runs-on: ubuntu-latest
    environment: android-production
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Make the Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true
          pub-cache: true

      - name: Check production configuration
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
          LIVEKIT_URL: ${{ vars.LIVEKIT_URL }}
          STRIPE_PUBLISHABLE_KEY: ${{ vars.STRIPE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_TEACHER_ID: ${{ vars.NEXT_PUBLIC_TEACHER_ID }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          required=(API_BASE_URL CLERK_PUBLISHABLE_KEY LIVEKIT_URL STRIPE_PUBLISHABLE_KEY NEXT_PUBLIC_TEACHER_ID ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD)
          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required GitHub environment variable or secret: $name"
              exit 1
            fi
          done
          [[ "$API_BASE_URL" == https://* ]] || { echo "::error::API_BASE_URL must use HTTPS"; exit 1; }
          [[ "$CLERK_PUBLISHABLE_KEY" == pk_live_* ]] || { echo "::error::Use the production Clerk publishable key"; exit 1; }
          [[ "$STRIPE_PUBLISHABLE_KEY" == pk_live_* ]] || { echo "::error::Use the production Stripe publishable key"; exit 1; }

      - name: Resolve Flutter dependencies
        run: flutter pub get --enforce-lockfile

      - name: Write signing key to runner temp storage
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          keystore_path="$RUNNER_TEMP/termini-upload-key.jks"
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          echo "ANDROID_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"

      - name: Build signed Android app bundle and APK
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
          LIVEKIT_URL: ${{ vars.LIVEKIT_URL }}
          STRIPE_PUBLISHABLE_KEY: ${{ vars.STRIPE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_TEACHER_ID: ${{ vars.NEXT_PUBLIC_TEACHER_ID }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          flutter build appbundle --release \
            --dart-define="API_BASE_URL=$API_BASE_URL" \
            --dart-define="CLERK_PUBLISHABLE_KEY=$CLERK_PUBLISHABLE_KEY" \
            --dart-define="LIVEKIT_URL=$LIVEKIT_URL" \
            --dart-define="STRIPE_PUBLISHABLE_KEY=$STRIPE_PUBLISHABLE_KEY" \
            --dart-define="NEXT_PUBLIC_TEACHER_ID=$NEXT_PUBLIC_TEACHER_ID"
          flutter build apk --release \
            --dart-define="API_BASE_URL=$API_BASE_URL" \
            --dart-define="CLERK_PUBLISHABLE_KEY=$CLERK_PUBLISHABLE_KEY" \
            --dart-define="LIVEKIT_URL=$LIVEKIT_URL" \
            --dart-define="STRIPE_PUBLISHABLE_KEY=$STRIPE_PUBLISHABLE_KEY" \
            --dart-define="NEXT_PUBLIC_TEACHER_ID=$NEXT_PUBLIC_TEACHER_ID"

      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/termini-upload-key.jks"

      - name: Save signed release artifacts
        uses: actions/upload-artifact@v6
        with:
          name: termini-android-${{ github.ref_name }}
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
