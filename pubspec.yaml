name: termini
description: "A production-quality multiplatform Flutter LMS clone of OEPlatform."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management & Architecture
  flutter_riverpod: ^3.4.3

  # Routing & Navigation
  go_router: ^14.8.1

  # Networking & HTTP
  dio: ^5.8.0+1
  http: ^1.3.0

  # Storage & Preferences
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.2

  # Clerk Authentication
  clerk_flutter: ^0.0.18-beta
  clerk_auth: ^0.0.18-beta
  flutter_svg: ^2.0.17
  flutter_localizations:
    sdk: flutter

  # Media & Video Playback
  video_player: ^2.9.3
  chewie: ^1.8.5

  # LiveKit WebRTC Meetings
  livekit_client: ^2.3.4

  # UI Components, Formats, Utilities
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  intl: ^0.20.2
  url_launcher: ^6.3.1
  flutter_markdown: ^0.7.6+1
  app_links: ^7.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env.example
    - assets/branding/
